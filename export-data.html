<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Exportar Dados ENERGIZA CRM</title>
  <style>
    body { font-family: monospace; background: #000; color: #FFE600; padding: 40px; }
    button { background: #FFE600; color: #000; border: none; padding: 14px 28px; font-size: 16px; font-weight: 700; border-radius: 999px; cursor: pointer; margin: 10px 10px 10px 0; }
    button:hover { background: #FFEA33; }
    pre { background: #111; color: #fff; padding: 20px; border: 1px solid rgba(255,230,0,.3); border-radius: 10px; overflow: auto; max-height: 600px; font-size: 12px; white-space: pre-wrap; word-break: break-all; display: none; margin-top: 20px; }
    h1 { margin-bottom: 8px; }
    p { color: rgba(255,255,255,.5); margin-bottom: 20px; }
    .ok { color: #22c55e; font-weight: 700; }
  </style>
</head>
<body>
  <h1>EXPORTAR DADOS — ENERGIZA CRM</h1>
  <p>Clique nos botões abaixo para exportar os dados do localStorage e do Supabase.</p>

  <button onclick="exportAll()">📦 Exportar TUDO (localStorage + config)</button>
  <button onclick="exportFunil()">🔀 Exportar Funil (propostas)</button>
  <button onclick="exportProdutos()">📦 Exportar Produtos</button>
  <button onclick="exportClientes()">👥 Exportar Clientes</button>
  <div id="status"></div>
  <pre id="output"></pre>

  <script>
    function get(key, fallback) {
      try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
      catch { return fallback; }
    }

    function exportAll() {
      const data = {
        exportDate: new Date().toISOString(),
        source: 'ENERGIZA CRM — Export via browser',
        localStorage: {},
      };
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        try { data.localStorage[k] = JSON.parse(localStorage.getItem(k)); }
        catch { data.localStorage[k] = localStorage.getItem(k); }
      }
      showOutput(data);
      document.getElementById('status').innerHTML = '<span class="ok">✅ Exportado! Copie o JSON abaixo.</span>';
    }

    function exportFunil() {
      const data = {
        exportDate: new Date().toISOString(),
        propostas: get('metrolab_propostas', []),
        propostasReal: get('duocrm-quotes', []),
      };
      showOutput(data);
      document.getElementById('status').innerHTML = '<span class="ok">✅ Funil exportado!</span>';
    }

    function exportProdutos() {
      const data = {
        exportDate: new Date().toISOString(),
        produtos: get('metrolab_produtos', []),
      };
      showOutput(data);
      document.getElementById('status').innerHTML = '<span class="ok">✅ Produtos exportados!</span>';
    }

    function exportClientes() {
      const data = {
        exportDate: new Date().toISOString(),
        clientes: get('metrolab_clients', []),
      };
      showOutput(data);
      document.getElementById('status').innerHTML = '<span class="ok">✅ Clientes exportados!</span>';
    }

    function showOutput(data) {
      const el = document.getElementById('output');
      el.style.display = 'block';
      el.textContent = JSON.stringify(data, null, 2);
      el.select();
      document.execCommand('copy');
    }
  </script>
</body>
</html>
